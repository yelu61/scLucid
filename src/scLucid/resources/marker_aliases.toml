# =============================================================================
# scLucid Marker Alias Registry
# =============================================================================
# Purpose:
# - Keep nomenclature aliases, paper-specific labels, and display-only gene aliases
#   out of marker lists.
# - Preserve original literature terms without letting them become canonical labels.
# - Support future review tools that map user labels to stable registry entries.
# =============================================================================

